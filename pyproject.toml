[project]
name = "agent-course"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "wikipedia>=1.4.0",
    "youtube-transcript-api>=1.2.5",
]

[tool.ruff.lint.per-file-ignores]
"parallel_multi_agent/config.py" = ["E402"]   # imports placed after load_dotenv() on purpose

[[tool.ty.overrides]]
include = ["src"]

[tool.ty.overrides.analysis]
return-type-inference = "never"