repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --fix
        language: unsupported
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format
        language: unsupported
        types: [python]
        
      # slower checks run only on push
      - id: ty
        name: ty
        entry: uvx ty check
        language: unsupported
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]